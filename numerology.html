        header .back-link {
            display: inline-block;
            margin-top: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.3s;

        header .back-link:hover {
            background: var(--border);
            color: #fff;
        }

        .container { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }

        .hook-section {
            background: var(--card-bg);
            border: 1px solid var(--border);

            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

        .hook-section .hook-emoji { font-size: 3rem; }

        .hook-section p {

        }

            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);

            color: var(--light);
            font-size: 1rem;
            margin-bottom: 1rem;

        }

            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;

        }

            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-top: 1.5rem;

        }
        .life-path-number {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.25);

        .life-path-info { text-align: left; }

            font-weight: 700;
            color: #f1f5f9;
        }
        .life-path-info .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .summary {
            margin: 1.5rem 0;
            padding: 1rem 1.2rem;
            background: #0f172a;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }
        .summary p { color: #cbd5e1; line-height: 1.8; }

        .element-chart {
            background: #0f172a;
            border-radius: 10px;
            padding: 1.2rem;
            margin: 1.2rem 0;
        }
        .element-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .element-label {
            width: 60px;
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 600;
        }
        .element-bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #0f172a;
            border-radius: 6px;
            margin: 0 0.8rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        .element-bar-fill {
            height: 100%;
            border-radius: 6px;
            width: 0%;
            transition: width 1.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .element-value { width: 40px; text-align: right; font-weight: 700; font-size: 0.9rem; color: #f8fafc; }

            margin: 1.2rem 0;

            font-weight: 900;
            color: var(--secondary);
        }

            background: #0f172a;
            border-radius: 12px;
            padding: 0.8rem;
            border: 1px solid var(--border);
            margin: 0.5rem 0;
        }
        .grid-row {
            display: flex;
            gap: 4px;
        }
        .grid-cell {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            background: #1e293b;
            transition: 0.3s;
        }
        .grid-cell.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(236,72,153,0.2));
            border: 2px solid var(--primary);
            color: #f1f5f9;
        }
        .grid-cell.inactive {
            background: #0f172a;
            border: 1px solid #334155;
            color: #475569;
        }

            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.25);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: #fda4af;
            font-weight: 500;
            margin-top: 1rem;
            line-height: 1.8;

            font-weight: 700;
            color: #f87171;
            display: block;
            margin-bottom: 0.2rem;
        }

            border-radius: 14px;

            text-align: center;
            margin-top: 1.5rem;

            display: inline-block;
            font-size: 0.8rem;
            color: #fda4af;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .paywall .price-tag {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f43f5e;
            margin: 0.3rem 0;
        }
        .paywall .price-tag span {

            color: #64748b;
            text-decoration: line-through;
            margin-right: 0.8rem;

            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }
        .paywall .price-daily strong { color: #fbbf24; font-weight: 700; }

            padding: 1rem 1.2rem;

            font-size: 0.85rem;
        }

            line-height: 1.8;

        .preview-block .preview-more {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* ===== 付費按鈕發光動畫 ===== */
        .pay-btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
            transition: 0.3s;
            margin-top: 0.3rem;
            animation: pulse-btn 2s ease-in-out infinite;
        }
        .pay-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }

        @keyframes pulse-btn {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
            }
            50% { 
                box-shadow: 0 0 45px rgba(236, 72, 153, 0.7);
                transform: scale(1.02);
            }
        }

        .paywall .guarantee {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .paywall .guarantee span { 
            color: #34d399; 
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        /* VIP 完整內容 */
        .vip-content {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--primary);
        }
        .vip-content h3 {
            color: #c084fc;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            margin-top: 1.5rem;
        }
        .vip-content .vip-section {
            background: #0f172a;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--secondary);
        }
        .vip-content .vip-section .vip-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .vip-content .vip-section p {
            color: #cbd5e1;
            line-height: 1.9;
            margin-bottom: 0.3rem;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        .back-to-top:hover {
            background: var(--border);
            color: #fff;
        }

        @media (max-width: 640px) {
            .life-path-circle { flex-direction: column; text-align: center; }
            .life-path-info { text-align: center; }
            .container { padding: 0 0.8rem; }
            .result-card { padding: 1.2rem; }
            .hook-section { padding: 1.2rem; }
            .grid-cell {
                width: 44px;
                height: 44px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
