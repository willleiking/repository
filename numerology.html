            height: 100px;

            align-items: center;
            justify-content: center;

            font-weight: 900;

        }

        }

            color: #cbd5e1;
            font-weight: 600;

            height: 56px;

            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            background: #1e293b;
            transition: 0.3s;

        .pay-btn {

            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);

            margin-top: 0.3rem;
            animation: pulse-btn 2s ease-in-out infinite;
        }
        .pay-btn:hover {
            transform: translateY(-2px) scale(1.02);

        }

        @keyframes pulse-btn {
            0%, 100% {

            }
            50% { 
                box-shadow: 0 0 45px rgba(236, 72, 153, 0.7);

            }

            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .paywall .guarantee span { 
            color: #34d399; 
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--primary);

            color: #c084fc;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            margin-top: 1.5rem;
        }
        .vip-content .vip-section {
            background: #0f172a;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--secondary);

            font-size: 0.7rem;
            color: var(--text-muted);

            letter-spacing: 0.5px;
        }
        .vip-content .vip-section p {
            color: #cbd5e1;
            line-height: 1.9;
            margin-bottom: 0.3rem;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        .back-to-top:hover {
            background: var(--border);
            color: #fff;
        }

        @media (max-width: 640px) {
            .life-path-circle { flex-direction: column; text-align: center; }
            .life-path-info { text-align: center; }
            .container { padding: 0 0.8rem; }
            .result-card { padding: 1.2rem; }
            .hook-section { padding: 1.2rem; }
            .grid-cell {
                width: 44px;
                height: 44px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

            let powerNumber = String(sum).split('').map(Number).reduce((a, b) => a + b, 0);
            let finalNumber = powerNumber;
            while (finalNumber > 9) {
                finalNumber = String(finalNumber).split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return {
                soulNumber: soulNumber,
                powerNumber: powerNumber,
                finalNumber: finalNumber,
                display: `${soulNumber}/${powerNumber}/${finalNumber}`,
                short: `${soulNumber}${powerNumber}${finalNumber}`
            };
        }

        function findMissingNumbers(birthday) {
            const digits = birthday.replace(/[^0-9]/g, '').split('').map(Number);
            const present = new Set(digits);
            const missing = [];
            for (let i = 1; i <= 9; i++) {
                if (!present.has(i)) missing.push(i);
