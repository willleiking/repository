            color: #cbd5e1;

            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);

            font-size: 0.9rem;

            .life-path-circle { flex-direction: column; text-align: center; }

            .container { padding: 0 0.8rem; }
            .result-card { padding: 1.2rem; }
            .hook-section { padding: 1.2rem; }
            .grid-cell {
                width: 44px;
                height: 44px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
