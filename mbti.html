<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBTI 16型人格 · 深度破解</title>
    <style>
        /* ===== 全域重置 ===== */
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark: #0f172a;
            --light: #f8fafc;
            --warning: #f59e0b;
            --success: #10b981;
            --card-bg: #1e293b;
            --border: #334155;
            --text-muted: #94a3b8;
            --text-light: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        body {
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 8px; }

        header {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            padding: 2rem 1rem 1.8rem;
            text-align: center;
            border-bottom: 2px solid #3b0764;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        header h1 {
            font-size: 2.6rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(to right, #a5b4fc, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        header p { color: var(--text-muted); font-size: 1.05rem; }
        header .back-link {
            display: inline-block;
            margin-top: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        header .back-link:hover {
            background: var(--border);
            color: #fff;
        }

        .container { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }

        /* ===== 測驗容器 ===== */
        .quiz-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .quiz-card.active { display: block; }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            margin-bottom: 1.8rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            transition: width 0.4s ease;
        }
        .question-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.6;
        }
        .options-list button {
            display: block;
            width: 100%;
            padding: 1rem 1.2rem;
            margin-bottom: 0.7rem;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--light);
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .options-list button:hover {
            background: var(--border);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        /* ===== 開始頁 ===== */
        .start-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .start-card .icon { font-size: 4rem; }
        .start-card h2 {
            font-size: 1.5rem;
            color: #f1f5f9;
            margin: 0.5rem 0;
        }
        .start-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto 1.5rem;
        }
        .start-btn {
            padding: 0.8rem 3rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }

        /* ===== 結果區 ===== */
        .result-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-top: 1.5rem;
        }
        .result-card .type-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .result-card .type-name {
            font-size: 2.8rem;
            font-weight: 900;
            color: #f1f5f9;
            line-height: 1.2;
        }
        .result-card .type-desc {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0.3rem 0 1rem;
        }

        .summary-box {
            background: #0f172a;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            margin: 1.2rem 0;
        }
        .summary-box p { color: #cbd5e1; line-height: 1.8; }

        .dimension-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 1.2rem 0;
        }
        .dimension-item {
            background: #0f172a;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .dimension-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dimension-item .value {
            font-weight: 700;
            color: #f1f5f9;
            font-size: 1rem;
        }
        .dimension-item .value .highlight-e { color: #f43f5e; }
        .dimension-item .value .highlight-i { color: #3b82f6; }
        .dimension-item .value .highlight-s { color: #10b981; }
        .dimension-item .value .highlight-n { color: #8b5cf6; }
        .dimension-item .value .highlight-t { color: #f59e0b; }
        .dimension-item .value .highlight-f { color: #ec4899; }
        .dimension-item .value .highlight-j { color: #06b6d4; }
        .dimension-item .value .highlight-p { color: #f59e0b; }

        .cliffhanger {
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.25);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: #fda4af;
            font-weight: 500;
            margin-top: 1rem;
            line-height: 1.8;
        }
        .cliffhanger .title {
            font-weight: 700;
            color: #f87171;
            display: block;
            margin-bottom: 0.2rem;
        }

        .paywall {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 1));
            border: 2px dashed var(--secondary);
            border-radius: 14px;
            padding: 2rem 1.5rem;
            text-align: center;
            margin-top: 1.5rem;
        }
        .paywall .urgency {
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.8rem;
            color: #fda4af;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        .paywall .urgency span { color: #f87171; font-weight: 700; }
        .paywall .price-tag {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f43f5e;
            margin: 0.3rem 0;
        }
        .paywall .price-tag span {
            font-size: 1rem;
            color: #64748b;
            text-decoration: line-through;
            margin-right: 0.8rem;
            font-weight: 400;
        }
        .paywall .price-daily {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }
        .paywall .price-daily strong { color: #fbbf24; font-weight: 700; }
        .pay-btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
            transition: 0.3s;
            margin-top: 0.3rem;
        }
        .pay-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.4);
        }
        .paywall .guarantee {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .paywall .guarantee span { color: #34d399; font-weight: 600; }

        .preview-block {
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 10px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .preview-block .preview-title {
            color: #a5b4fc;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .preview-block .preview-text {
            color: #fda4af;
            font-size: 0.9rem;
            font-style: italic;
            margin: 0.3rem 0;
        }
        .preview-block .preview-more {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* VIP 內容 */
        .vip-content {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--primary);
        }
        .vip-content h3 {
            color: #c084fc;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
        }
        .vip-section {
            background: #0f172a;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--secondary);
        }
        .vip-section .vip-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .vip-section p {
            color: #cbd5e1;
            line-height: 1.9;
        }

        .stack-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.3rem;
        }
        .stack-tag {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 0.15rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #a5b4fc;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        .back-to-top:hover {
            background: var(--border);
            color: #fff;
        }

        @media (max-width: 640px) {
            .dimension-grid { grid-template-columns: 1fr; }
            .result-card .type-name { font-size: 2rem; }
            .container { padding: 0 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🧠 MBTI 16型人格 · 深度破解</h1>
        <p>24道精準情境題，真實計算你的認知功能與人格類型</p>
        <a href="index.html" class="back-link">← 返回入口</a>
    </header>

    <div class="container">

        <!-- ===== 開始頁 ===== -->
        <div id="start-card" class="start-card">
            <div class="icon">🧠</div>
            <h2>你準備好探索真實的自己了嗎？</h2>
            <p>
                透過 24 道情境題，精準定位你的認知功能偏好。<br />
                這不是普通的二分法測驗，而是基於榮格心理學的深度人格解構。
            </p>
            <button class="start-btn" onclick="startQuiz()">🚀 開始測驗</button>
        </div>

        <!-- ===== 測驗區 ===== -->
        <div id="quiz-card" class="quiz-card">
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
            <div id="question" class="question-text">載入題目…</div>
            <div id="options" class="options-list"></div>
        </div>

        <!-- ===== 結果區 ===== -->
        <div id="result-card" class="result-card">
            <!-- 由 JavaScript 動態填入 -->
        </div>

    </div>

    <script>
        // ================================================================
        //  1. 題庫（24 題，每個維度 6 題）
        // ================================================================

        const MBTI_QUESTIONS = [
            // EI (6題)

        // ================================================================
        //  3. 核心邏輯
        // ================================================================

        const state = {
            step: 0,
            answers: [],
            quizStarted: false,
            paid: false,
            resultType: null
        };

        function startQuiz() {
            state.step = 0;
            state.answers = [];
            state.paid = false;
            state.quizStarted = true;
            document.getElementById('start-card').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';
            document.getElementById('result-card').style.display = 'none';
            renderQuestion();
        }

        function renderQuestion() {
            const total = MBTI_QUESTIONS.length;
            const progress = (state.step / total) * 100;
            document.getElementById('progress').style.width = progress + '%';

            if (state.step >= total) {
                showResult();
                return;
            }

            const q = MBTI_QUESTIONS[state.step];
            document.getElementById('question').textContent = q.q;
            const container = document.getElementById('options');
            container.innerHTML = '';
            q.a.forEach((text, idx) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.onclick = () => {
                    state.answers.push(idx);
                    state.step++;
                    renderQuestion();
                };
                container.appendChild(btn);
            });
        }

        function getMBTIType(answers) {
            let e = 0,
                i = 0,
                s = 0,
                n = 0,
                t = 0,
                f = 0,
                j = 0,
                p = 0;
            const dimMap = MBTI_QUESTIONS.map(q => q.dim);
            for (let idx = 0; idx < answers.length; idx++) {
                const dim = dimMap[idx];
                const val = answers[idx];
                if (dim === 'EI') { val === 0 ? e++ : i++; } else if (dim === 'SN') { val === 0 ? s++ : n++; } else if (dim ===
                    'TF') { val === 0 ? t++ : f++; } else if (dim === 'JP') { val === 0 ? j++ : p++; }
            }
            const first = e >= i ? 'E' : 'I';
            const second = s >= n ? 'S' : 'N';
            const third = t >= f ? 'T' : 'F';
            const fourth = j >= p ? 'J' : 'P';
            return first + second + third + fourth;
        }

            const map = {

                ISFP: '探險家',

            };
            return map[type] || '探索者';
        }

            const type = getMBTIType(state.answers);

            const resultDiv = document.getElementById('result-card');
            resultDiv.style.display = 'block';

            for (let idx = 0; idx < state.answers.length; idx++) {
                const dim = dimMap[idx];
                const val = state.answers[idx];
                if (dim === 'EI') { val === 0 ? dimScores.E++ : dimScores.I++; } else if (dim === 'SN') { val === 0 ? dimScores
                        .S++ : dimScores.N++; } else if (dim === 'TF') { val === 0 ? dimScores.T++ : dimScores.F++; } else if (
                    dim === 'JP') { val === 0 ? dimScores.J++ : dimScores.P++; }
            }

            const dimLabels = [
                { label: '外向 E', val: dimScores.E, max: 6, highlight: 'highlight-e' },

                <div class="dimension-grid">${dimHtml}</div>

                <div class="cliffhanger">

                <div class="preview-block">

                        <div style="color:var(--text-muted);font-size:0.85rem;margin:0.3rem 0;">

                        </div>
                        <div class="price-tag"><span>NT$ 599</span> NT$ 99</div>

                        <button class="pay-btn" onclick="simulatePayment()">💳 立即解鎖完整報告</button>

                    </div>
                </div>

                <div id="vip-content-area" class="vip-content">

                    <div class="vip-section">

                    <div class="vip-section">

                <div style="text-align:center;margin-top:1.5rem;">

            resultDiv.scrollIntoView({ behavior: 'smooth' });

        let isPaid = false;

        function simulatePayment() {
            if (isPaid) {
                alert('✅ 你已經解鎖完整報告了！');
                return;
            }
            alert('✅ 模擬付費成功！\n系統已為您解鎖完整 VIP 人格深度報告。');
            isPaid = true;
            document.getElementById('paywall-area').style.display = 'none';
            document.getElementById('vip-content-area').style.display = 'block';
            document.getElementById('vip-content-area').scrollIntoView({ behavior: 'smooth' });
        }

        // ================================================================

        document.addEventListener('DOMContentLoaded', () => {
